services:
  - type: web
    name: super-mel-api
    runtime: node
    region: oregon
    plan: free
    buildCommand: pnpm install && pnpm db:generate && pnpm build:backend
    startCommand: node packages/backend/dist/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: super-mel-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://super-mel.onrender.com

  - type: web
    name: super-mel
    runtime: static
    buildCommand: pnpm install && pnpm build:frontend
    staticPublishPath: packages/frontend/dist
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: super-mel-db
    plan: free
    region: oregon
